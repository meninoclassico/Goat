async function year(){const T=C.T,age=C.age,club=C.club,pi=S.pos,gk=!pi,R=C.R,tg=[],P=POS[pi];let o=oAt(age)+(C.fb||0),ev='',inj=0;C.fb=0;const e=R();
if(e<.025+(age>30?.015:0)){if(R()<.25||(age>=34&&R()<.4)){C.over=1;ev='💥 Lesão gravíssima: sua carreira termina aqui.'}else{inj=1+(await dec('Você se lesiona. Como vai lidar?',[['VOLTAR ANTES','Volta mais cedo — mas sua fase cai por um tempo.'],['DESCANSAR DIREITO','Perde mais jogos agora, volta mais afiado.']]));ev=inj==1?'🩹 Lesão: você voltou mais cedo, mas ainda sem ritmo.':'🩹 Lesão: você descansou direito e deve voltar mais afiado.';if(inj==1){o-=3;C.fb=-2}else C.fb=2}}
else if(e<.09){ev='🔥 Fase iluminada: você jogou demais.';o+=3}else if(e<.12){ev='😤 Crise no vestiário: rendimento em queda.';o-=4}
const cs=cstr(club),gm=Math.round((age<18?8+R()*8:age<20?20+R()*10:o<60?12+R()*8:(30+R()*8)*(age>=36?.8:1))*(C.over?.3:inj==1?.7:inj==2?.35:1));
const rt=Math.max(5.5,Math.min(9.4,5.9+(o-62)*.045+(R()-.5)*.6)),f=Math.pow(Math.max(o,30)/90,3)*(.75+cs/20)*(1+(S.slots[6]-3)*.03)*(1+(S.slots[7]-3)*.02);
const ex=r=>{const m=gm*r*f;return Math.max(0,Math.round(m+(R()+R()-1)*Math.sqrt(m+1)*1.5))};
let gl=ex(GR[pi]),as=ex(AR[pi]),csh=0;
if(gk){gl=0;as=0;csh=Math.max(0,Math.min(gm,Math.round(gm*(.15+cs*.025+(o-70)*.004)+(R()-.5)*3)))}
if(age>=18&&!C.over&&R()<.6){const op=CL.filter(x=>x[3]==club[3]&&x!=club),r=await ukick('PÊNALTI!',`${op.length?rd(op)[0]:'Rival'} · ${1+Math.floor(R()*89)}' · ${sy(age)}`,gk);if(gk){if(r){csh++;tg.push('🧤 Pegou pênalti')}}else if(r){gl++;tg.push('Pênalti convertido')}else tg.push('Pênalti perdido')}
const reg=gm>=18&&!C.over,tb=table(club,cs,o),p=tb.findIndex(x=>x.me)+1,lg=p==1&&reg;let ctw=0,wcw=0;if(p==1&&!reg)tg.push('Campeão como reserva');

if(p<=8&&reg){const r=await fin(cn,Math.max(.02,Math.min(.45,.03+(cs-6)*.035+(o-78)*.004))*(/Europa|Sul/.test(cn)?1.2:1),0,0,club[2],{Champions:7,'Liga Europa':4,Libertadores:5,'Sul-Americana':3}[cn]||3);if(r>0){ctw=1;T.ct++;tg.push('🏆 '+cn);await trophy(cn,age);if(/^(Champions|Libertadores|Champions Ásia|Concachampions)$/.test(cn)){const r2=await fin('Mundial de Clubes',1,0,1,club[2]=='EU'?'SA':'EU',club[2]=='EU'?5:7);if(r2>0){T.mc++;tg.push('🏆 Mundial de Clubes');await trophy('Mundial de Clubes',age)}else tg.push('Vice Mundial de Clubes')}}else if(!r)tg.push('Vice '+cn)}
if(age%4==0&&age>=20&&age<=36){const ns=CT[S.nat][2];if(o>=94-ns*1.8&&!C.over){const d=await dec('A seleção pede um compromisso de verdade.',[['ABRAÇAR A SELEÇÃO','Caça a Copa; a fase no clube cai um pouco.'],['PRIORIZAR O CLUBE','Mais afiado no clube, menos peso na Copa.']]);C.fb=d?1:-1;const r=await fin('Copa do Mundo',Math.max(.02,Math.min(.45,.03+(ns-5)*.03+(o-80)*.004+(d?-.04:.05))),1);if(r>0){wcw=1;T.wc++;tg.push('🏆 Copa do Mundo');await trophy('Copa do Mundo',age)}else tg.push(r?'Convocado: Copa do Mundo':'Vice Copa do Mundo')}else tg.push('Fora da convocação')}

function final(){const T=C.T,P=POS[S.pos],gk=!S.pos,ti=T.lg+T.ct+T.cup+T.wc+T.mc,pk=Math.max(...C.rows.map(r=>r.o));
